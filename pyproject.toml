[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-purifier"
version = "0.1.0"
description = "Remove third-party promotions, trackers and active content from EPUB files, and inspect them for security threats."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "EPUB Purifier contributors" }]
keywords = ["epub", "ebook", "security", "privacy", "sanitizer", "debloat", "epub3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "defusedxml>=0.7.1",
  "pillow>=10.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "httpx>=0.27",
]

[project.scripts]
epub-purifier = "epub_purifier.cli:main"
epub-purifier-web = "epub_purifier.web.app:main"

[project.urls]
Homepage = "https://github.com/epub-purifier/epub-purifier"
Documentation = "https://github.com/epub-purifier/epub-purifier#readme"
Issues = "https://github.com/epub-purifier/epub-purifier/issues"
Changelog = "https://github.com/epub-purifier/epub-purifier/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"epub_purifier.web" = ["static/*", "templates/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101", "S104", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
